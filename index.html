<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>832401313 计算器</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="page-shell">
      <header class="site-header">
        <div class="brand-mark"><span></span> 832401313 计算器</div>
        <div class="header-actions">
          <button id="theme-toggle" class="icon-button" type="button" aria-label="切换主题">☼</button>
        </div>
      </header>

      <section class="hero">
        <div>
          <h1>计算器</h1>
          <p class="subtitle">简单、清晰，支持表达式计算和历史记录。</p>
        </div>
        <div class="hero-note"><strong>01</strong><span>SAFE<br />PARSER</span></div>
      </section>

      <section class="workspace">
        <article class="calculator-panel panel">
          <div class="panel-topline"><span>计算器</span><span class="live-dot">● 就绪</span></div>
          <div class="display-area">
            <div class="input-label"><label for="expression">表达式</label></div>
            <input id="expression" type="text" placeholder="例如： (1 + 2) * 3" autocomplete="off" />
            <div class="result-row">
              <div><p class="result-label">后端返回结果</p><div id="result" class="result" aria-live="polite">等待输入</div></div>
              <button id="copy-result" class="copy-button" type="button">复制</button>
            </div>
            <div id="message" class="message" aria-live="polite">输入表达式后按 Enter，或点击等号。</div>
          </div>

          <div class="keypad" aria-label="计算器按键">
            <button class="key key-muted" data-action="clear">AC</button>
            <button class="key key-muted" data-action="backspace">⌫</button>
            <button class="key key-soft" data-action="answer">Ans</button>
            <button class="key key-muted" data-action="clear">清空</button>
            <button class="key key-operator" data-value="(">(</button><button class="key key-operator" data-value=")">)</button><button class="key key-operator" data-value="/">÷</button><button class="key key-operator" data-value="*">×</button>
            <button class="key" data-value="7">7</button><button class="key" data-value="8">8</button><button class="key" data-value="9">9</button><button class="key key-operator" data-value="-">−</button>
            <button class="key" data-value="4">4</button><button class="key" data-value="5">5</button><button class="key" data-value="6">6</button><button class="key key-operator" data-value="+">＋</button>
            <button class="key" data-value="1">1</button><button class="key" data-value="2">2</button><button class="key" data-value="3">3</button><button class="key key-equals" data-action="calculate">=</button>
            <button class="key key-wide" data-value="0">0</button><button class="key" data-value=".">小数点</button><span class="key-spacer" aria-hidden="true"></span>
          </div>
          <div class="shortcut-row"><span>Enter 计算</span><span>Esc 清空</span><span>Ans 插入上次结果</span></div>
        </article>

        <aside class="history-panel panel">
          <div class="panel-topline"><span>历史记录</span><span id="history-count">0 条</span></div>
          <div class="history-heading"><div><h2>计算记录</h2></div><button id="refresh-history" class="small-button" type="button">刷新</button></div>
          <div class="history-tools"><input id="history-search" type="search" placeholder="搜索表达式或结果" autocomplete="off" /><button id="clear-history" class="small-button danger" type="button">清空全部</button></div>
          <div id="history-list" class="history-list"><p class="empty-state">正在读取历史记录……</p></div>
          <div class="history-footnote">刷新页面后，历史记录仍会保留。</div>
        </aside>
      </section>

      <footer class="page-footer"><span>832401313 计算器</span><span>Enter 计算 · Esc 清空</span></footer>
    </main>
    <script src="app.js"></script>
  </body>
</html>
